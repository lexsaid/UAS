{% load static %}<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comedor{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317352b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23f4c430'/%3E%3C/svg%3E">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}{% endblock %}

  {% if messages %}
    <div class="avisos" role="status">
      {% for mensaje in messages %}
        <p class="aviso aviso-{{ mensaje.tags }}">{{ mensaje }}</p>
      {% endfor %}
    </div>
  {% endif %}

  <main class="pagina">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
